name: Account regression (manual)

# Deliberate regression only; feature pushes must not start the full journey suite.
# Keep the filename so existing manual links remain valid.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-backend:
    name: Resolve integration backend
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.backend.outputs.sha }}
    steps:
      - name: Resolve backend main once for this run
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/pidrogame/pidro-backend/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Integration backend: $sha" >> "$GITHUB_STEP_SUMMARY"

  account-e2e:
    name: Account e2e
    needs: integration-backend
    uses: ./.github/workflows/account-e2e.yml
    with:
      backend-sha: ${{ needs.integration-backend.outputs.sha }}
      retention-days: 90
