name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  # The release test: Actions → Frontend CI → Run workflow. It never publishes a beta
  # update; beta-update.yml publishes green pushes only.
  workflow_dispatch:
    inputs:
      full:
        description: Run everything (every case, every viewport, Game e2e, all account journeys)
        type: boolean
        default: true

permissions:
  contents: read

# A release test never cancels a push's run, or the other way round.
concurrency:
  group: frontend-ci-${{ github.event_name == 'workflow_dispatch' && 'release-' || '' }}${{ github.ref }}
  cancel-in-progress: true

# Faster runners: install the Blacksmith GitHub app (blacksmith.sh) on this
# repo, then flip every job with a single repo variable — no commit needed:
#   gh variable set CI_RUNNER --body blacksmith-4vcpu-ubuntu-2404
# Unset the variable to fall back to GitHub-hosted runners.

jobs:
  # What this push runs (scripts/ci-affected.mjs): the changes since the last green
  # push on main, mapped to UI cases and e2e suites. Anything unclear runs everything.
  select:
    name: Select checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      full: ${{ steps.select.outputs.full }}
      ui: ${{ steps.select.outputs.ui }}
      ui_cases: ${{ steps.select.outputs.ui_cases }}
      ui_viewports: ${{ steps.select.outputs.ui_viewports }}
      shards: ${{ steps.select.outputs.shards }}
      game: ${{ steps.select.outputs.game }}
      accounts: ${{ steps.select.outputs.accounts }}
      account_specs: ${{ steps.select.outputs.account_specs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # A push is measured from the last green push on main, not from the previous push:
      # a newer push cancels an older run, and a red main has not shipped its changes yet.
      - name: Pick what this run checks
        id: select
        working-directory: packages/mobile
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push)
              base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Frontend CI" --branch main \
                --event push --status success --limit 1 --json headSha -q '.[0].headSha' || true) ;;
            pull_request) base=$PR_BASE ;;
            workflow_dispatch)
              if [ "$FULL" != false ]; then base=--full; else base=$(git rev-parse HEAD~1); fi ;;
            *) base= ;;
          esac
          node scripts/ci-affected.mjs "$base" "$GITHUB_SHA"

  integration-backend:
    name: Resolve integration backend
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.backend.outputs.sha }}
    steps:
      - name: Resolve backend main once for this run
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/pidrogame/pidro-backend/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Integration backend: $sha" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Mobile quality
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Run unit tests
        run: bun run test:unit

      - name: Check mobile source
        working-directory: packages/mobile
        run: |
          bun run lint
          bunx tsc --noEmit
          bunx expo install --check

      - name: Export production web bundle
        working-directory: packages/mobile
        env:
          EXPO_NO_DOTENV: '1'
          NODE_OPTIONS: --require ./scripts/tailwind-v3-resolve.cjs
        run: bunx expo export --platform web --output-dir /tmp/pidro-mobile-web

      # The account journeys' stand-in for the native sign-in sheets (e2eProviders.ts) is
      # compiled out of every release bundle (__DEV__ is false there); this one must hold none of it.
      - name: Check the web bundle holds no test seam
        run: |
          if grep -rq __pidroE2E /tmp/pidro-mobile-web; then
            echo "The production web export contains __pidroE2E"
            exit 1
          fi

  # Balance the selected viewport/case matrix across up to ten jobs by recorded duration
  # (scripts/ui-case-costs.json), about forty screens each, plus the UI suites the change
  # touches. The aggregate verifies exact coverage before comparing the merged captures.
  ui-grammar-shard:
    name: UI grammar (${{ matrix.shard }})
    needs: select
    if: needs.select.outputs.ui == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build shared package
        run: bun run shared:build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium for UI verification
        run: bunx playwright install --with-deps chromium

      # Metro keys its transform cache by file content, so a warm cache only skips
      # recompiling unchanged modules; NativeWind's CSS is never served from it.
      - name: Cache Metro transforms
        uses: actions/cache@v4
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Verify mobile UI grammar
        working-directory: packages/mobile
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          # The full fixture matrix retains Metro/SSR modules across many navigations.
          NODE_OPTIONS: --max-old-space-size=8192 --require ./scripts/tailwind-v3-resolve.cjs
          UI_SHOT_DIR: /tmp/ui-grammar-screens
          UI_PARTITION: ${{ matrix.partition }}
          UI_CASES: ${{ needs.select.outputs.ui_cases }}
          UI_VIEWPORTS: ${{ needs.select.outputs.ui_viewports }}
          UI_REPORT_PATH: /tmp/ui-reports/${{ matrix.shard }}.json
          UI_SHARD: ${{ matrix.shard }}
        run: |
          cleanup() {
            kill "$expo_pid" 2>/dev/null || true
            wait "$expo_pid" 2>/dev/null || true
          }
          start_expo() {
            # Track the server itself, not a package-manager wrapper.
            ../../node_modules/.bin/expo start --web --port 8081 >> /tmp/pidro-expo.log 2>&1 &
            expo_pid=$!
            trap cleanup EXIT

            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://127.0.0.1:8081/home >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [ "$ready" != "true" ]; then
              cat /tmp/pidro-expo.log
              exit 1
            fi
          }
          start_expo

          if [ -n "$UI_PARTITION" ]; then
            if [ "$UI_SHARD" = "matrix-1" ]; then
              node scripts/verify-ui-readiness.mjs
            fi
            bun run test:ui
            exit 0
          fi

          # The remaining suites are independent of the screenshot matrix and of each other.
          if [ "$UI_SHARD" = "seats-and-game-over" ]; then
            # Additional sizes/scales are assertion-gated; their captures are diagnostic artifacts.
            # The waiting-room pixel baselines come from the test:ui shards (three standard viewports).
            UI_SHOT_DIR=/tmp/ui-grammar-screens/waiting-seats node scripts/verify-waiting-seats.mjs
            # Bound Metro/SSR retention: the waiting-seat matrix approaches the heap limit.
            cleanup
            start_expo
            UI_SHOT_DIR=/tmp/ui-grammar-screens/game-over node scripts/verify-game-over.mjs
            exit 0
          fi

          if [ "$UI_SHARD" = "table-behavior" ]; then
            UI_SHOT_DIR=/tmp/ui-grammar-screens/table-chrome node scripts/verify-table-chrome.mjs
            node scripts/verify-seat-decisions.mjs
            node scripts/verify-dealing.mjs
            exit 0
          fi

          UI_SHOT_DIR=/tmp/lobby-screens node scripts/verify-lobby.mjs
          UI_SHOT_DIR=/tmp/ui-grammar-screens/creation node scripts/verify-create-room.mjs

      - name: Upload shard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shard-${{ matrix.shard }}
          path: /tmp/ui-grammar-screens/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload case timings and coverage
        if: always() && matrix.partition != ''
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ matrix.shard }}
          path: /tmp/ui-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Upload lobby diagnostics
        if: always() && matrix.shard == 'lobby-and-creation'
        uses: actions/upload-artifact@v4
        with:
          name: lobby-screenshots
          path: |
            /tmp/lobby-screens/
            /tmp/pidro-expo.log
          if-no-files-found: ignore
          retention-days: 14

  ui-grammar:
    name: UI grammar
    needs: [select, ui-grammar-shard]
    # Skipped only when the selection ran and chose nothing visual.
    if: ${{ !cancelled() && needs.select.outputs.ui != 'false' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Merge shard screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: ui-shard-*
          path: /tmp/ui-grammar-screens
          merge-multiple: true

      # Keep this artifact capture-only: the baseline updater downloads it verbatim, and
      # overlays a partial run's captures instead of replacing every baseline.
      - name: Upload UI grammar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-grammar-screenshots${{ needs.select.outputs.full != 'true' && '-partial' || '' }}
          path: /tmp/ui-grammar-screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Require every shard to pass
        if: needs.ui-grammar-shard.result != 'success'
        run: |
          echo "A UI grammar shard did not pass (${{ needs.ui-grammar-shard.result }}); see its job log."
          exit 1

      - name: Download case timings and coverage
        uses: actions/download-artifact@v4
        with:
          pattern: ui-report-*
          path: /tmp/ui-reports
          merge-multiple: true

      # Every selected case exactly once; on a full run that is the complete inventory.
      - name: Require the complete visual inventory
        shell: bash
        working-directory: packages/mobile
        env:
          UI_SHOT_DIR: /tmp/ui-grammar-screens
          UI_CASES: ${{ needs.select.outputs.ui_cases }}
          UI_VIEWPORTS: ${{ needs.select.outputs.ui_viewports }}
        run: node scripts/verify-ui-grammar.mjs --verify-coverage /tmp/ui-reports | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare against visual baselines
        working-directory: packages/mobile
        env:
          UI_SHOT_DIR: /tmp/ui-grammar-screens
          UI_DIFF_PARTIAL: ${{ needs.select.outputs.full != 'true' && '1' || '' }}
        run: bun run test:ui:diff

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-grammar-diffs
          path: /tmp/ui-grammar-screens/diffs/
          if-no-files-found: ignore
          retention-days: 14

  game-e2e:
    name: Game e2e
    needs: [select, integration-backend]
    if: needs.select.outputs.game == 'true'
    uses: ./.github/workflows/game-e2e.yml
    with:
      backend-sha: ${{ needs.integration-backend.outputs.sha }}

  account-e2e-shards:
    name: Account shards
    needs: [select, integration-backend]
    if: needs.select.outputs.accounts == 'true'
    uses: ./.github/workflows/account-e2e.yml
    with:
      backend-sha: ${{ needs.integration-backend.outputs.sha }}
      # Empty runs every journey; a table push names the ones that play through the table.
      specs: ${{ needs.select.outputs.account_specs }}

  account-e2e:
    name: Account e2e
    needs: [select, account-e2e-shards]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every account shard and expiry check to pass
        env:
          RESULT: ${{ needs.account-e2e-shards.result }}
          SELECTED: ${{ needs.select.outputs.accounts }}
        run: |
          echo "Account journeys: $RESULT (selected: ${SELECTED:-unknown})"
          if [ "$SELECTED" = false ] && [ "$RESULT" = skipped ]; then exit 0; fi
          test "$RESULT" = success

  ready:
    # ship.mjs releases to production only on a run that checked everything.
    name: ${{ needs.select.outputs.full == 'true' && 'Frontend ready (full)' || 'Frontend ready' }}
    needs: [select, quality, ui-grammar, game-e2e, account-e2e]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # A check may be skipped only because the selection said so; anything else fails.
      - name: Require all regression checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .select.outputs as $selected
            | .select.result == "success"
            and all(.quality, .["account-e2e"]; .result == "success")
            and (.["ui-grammar"].result == "success"
              or (.["ui-grammar"].result == "skipped" and $selected.ui == "false"))
            and (.["game-e2e"].result == "success"
              or (.["game-e2e"].result == "skipped" and $selected.game == "false"))'
