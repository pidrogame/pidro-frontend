<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
.ink{font-family:"Nunito",sans-serif;color:#1d2433;margin:0}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:"Bree Serif",serif;color:#8F5E12}
</style>
</head><body>

<main class="felt" style="width: 540px; height: 960px; box-sizing: border-box; padding: 64px 50px 48px; display: flex; flex-direction: column; align-items: center; gap: 28px">

<article aria-label="Bengt's player card" style="position: relative; width: 440px; height: 660px; box-sizing: border-box; border-radius: 26px; padding: 12px; background: linear-gradient(180deg, #F6DE9A 0%, #E2AF45 35%, #C4892A 65%, #8F5E12 100%); box-shadow: 0px 24px 50px rgba(0, 8, 20, 0.6); transform: rotate(-2deg)">
<div style="position: relative; height: 100%; box-sizing: border-box; border-radius: 16px; background: #fbfbf7; border: 1.5px solid #2A1505; display: flex; flex-direction: column; align-items: center; padding: 56px 36px 36px; gap: 10px; overflow: hidden">
<span class="idx" aria-hidden="true" style="left: 16px; top: 12px"><span style="font-size: 30px; line-height: 30px">★4</span><svg width="20" height="20" viewBox="0 0 24 24" fill="#1d2433"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span>
<span class="idx" aria-hidden="true" style="right: 16px; bottom: 12px; transform: rotate(180deg)"><span style="font-size: 30px; line-height: 30px">★4</span><svg width="20" height="20" viewBox="0 0 24 24" fill="#1d2433"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span>

<div style="position: relative; width: 196px; height: 196px; margin-bottom: 10px">
<span aria-hidden="true" style="position: absolute; left: -40px; top: -40px; width: 276px; height: 276px; border-radius: 999px; background: radial-gradient(circle, rgba(226, 175, 69, 0.35) 0%, rgba(226, 175, 69, 0) 70%)"></span>
<span class="ring" style="position: relative; width: 196px; height: 196px; padding: 8px"><span class="face-initial" style="font-size: 88px">B</span></span>
<span class="gem" aria-hidden="true" style="left: 86px; top: -12px; width: 24px; height: 24px"></span>
<span class="medal" aria-hidden="true" style="right: -8px; top: 6px; width: 54px; height: 54px; padding: 3px"><span class="coin"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFD447"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span></span>
</div>

<p style="margin: 0; font-family: 'Bree Serif', serif; font-size: 46px; line-height: 52px; color: #1d2433">Bengt</p>
<p class="ink" style="font-weight: 900; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #8F5E12">Legend · 4 stars</p>

<div style="width: 100%; height: 1px; background: rgba(29, 36, 51, 0.15); margin: 14px 0 8px"></div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="display: flex; flex-direction: column; align-items: center"><span class="ink" style="font-weight: 900; font-size: 26px; line-height: 32px">40,612</span><span class="ink" style="font-weight: 700; font-size: 12px; color: #5a6476">games</span></div>
<div style="display: flex; flex-direction: column; align-items: center"><span class="ink" style="font-weight: 900; font-size: 26px; line-height: 32px">55%</span><span class="ink" style="font-weight: 700; font-size: 12px; color: #5a6476">won</span></div>
<div style="display: flex; flex-direction: column; align-items: center"><span class="ink" style="font-weight: 900; font-size: 26px; line-height: 32px">2011</span><span class="ink" style="font-weight: 700; font-size: 12px; color: #5a6476">playing since</span></div>
</div>
<p class="ink" style="margin-top: auto; font-weight: 800; font-size: 13px; color: #5a6476">Pidro Classic · Founding Supporter</p>
</div>
</article>

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 12px">
<p class="display" style="font-size: 30px; line-height: 36px">Sit at my table</p>
<p class="label" style="font-size: 17px; color: #8beaff">pidro.online/play/bengt</p>
</div>
</main>

</body></html>
