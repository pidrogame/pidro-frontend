<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="pidro-ds-v2.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&amp;family=Nunito:wght@500;600;700;800;900&amp;display=swap">
<style>
body{margin:0;font-family:"Nunito",sans-serif;color:#ffffff;background:#07264c}
a{color:#8beaff}a:hover{color:#c4f4ff}
.lvl.legend{background:linear-gradient(180deg,#F6DE9A 0%,#E2AF45 45%,#C4892A 100%);color:#3a1c05;border-color:#8F5E12}
</style>
</head><body>

<main class="felt" style="width: 390px; height: 844px; box-sizing: border-box">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: space-around; opacity: 0.6">
<span class="ring glass-ring" style="width: 52px; height: 52px; padding: 3px"><span class="face-initial" style="font-size: 22px">M</span></span>
<span class="ring" style="width: 52px; height: 52px; padding: 3px"><span class="face-initial" style="font-size: 22px">K</span></span>
<span class="ring glass-ring" style="width: 52px; height: 52px; padding: 3px"><span class="face-initial" style="font-size: 22px">A</span></span>
</div>
<div class="scrim"></div>

<section class="sheet" role="dialog" aria-label="Kalle" style="position: absolute; left: 0; right: 0; top: 156px; bottom: 0; padding: 10px 20px 34px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span class="grabber"></span>
<div style="align-self: stretch; display: flex; justify-content: flex-end; margin-bottom: -40px">
<a class="glass" href="Status-Player.dc.html" aria-label="Block or report Kalle" style="width: 44px; height: 44px"><span class="face"><svg width="20" height="20" viewBox="0 0 24 24" fill="#CFEFFF" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></span></a>
</div>

<div style="position: relative; width: 104px; height: 104px; margin: 4px 0 10px; flex-shrink: 0">
<span class="ring" style="width: 104px; height: 104px; padding: 5px"><span class="face-initial" style="font-size: 46px">K</span></span>
<span class="medal" aria-hidden="true" style="right: -6px; top: 0; width: 34px; height: 34px; padding: 2.5px"><span class="coin"><svg width="15" height="15" viewBox="0 0 24 24" fill="#FFD447"><path d="M12 3c-3 3.6-7 6.2-7 10 0 2.2 1.7 3.8 3.8 3.8 1.2 0 2.2-.5 2.7-1.3-.2 1.7-.9 3.2-2.3 4.5h5.6c-1.4-1.3-2.1-2.8-2.3-4.5.5.8 1.5 1.3 2.7 1.3 2.1 0 3.8-1.6 3.8-3.8 0-3.8-4-6.4-7-10z"></path></svg></span></span>
<span class="lvl legend" style="bottom: -12px; min-width: 46px; height: 24px; padding: 0 8px; font-size: 13px">100</span>
</div>
<h2 class="display" style="font-size: 28px; line-height: 34px">Kalle</h2>
<p class="label" style="color: #FFD447; margin-top: -6px">Legend · Level 100</p>
<p class="meta" style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #FFD447"></span>At your table · Pidro Classic since 2014</p>

<div class="subtle" style="align-self: stretch; padding: 12px 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 4px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="num" style="font-size: 20px; line-height: 26px">10,420</span><span class="meta">games</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid rgba(184, 225, 246, 0.22); border-right: 1px solid rgba(184, 225, 246, 0.22)"><span class="num" style="font-size: 20px; line-height: 26px">53%</span><span class="meta">won</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span class="num" style="font-size: 20px; line-height: 26px">7</span><span class="meta">medals</span></div>
</div>

<div class="subtle" style="align-self: stretch; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-shrink: 0">
<span class="ring" style="width: 36px; height: 36px; padding: 2px"><span class="face-initial" style="font-size: 15px; border-width: 1px">B</span></span>
<span class="ring" style="width: 36px; height: 36px; padding: 2px; margin-left: -10px"><span class="face-initial" style="font-size: 15px; border-width: 1px">K</span></span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span class="label" style="font-size: 14px">You two: 23 games together</span>
<span class="meta">14 won as partners · 4 of 9 against each other</span>
</span>
</div>

<p class="body" style="align-self: stretch; text-align: center; color: rgba(239, 249, 255, 0.72); font-style: italic">[KALLE'S ABOUT LINE]</p>

<a class="wood" href="Status-Player.dc.html" style="width: 100%; height: 58px; margin-top: auto; flex-shrink: 0"><span class="face" style="font-size: 21px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20c.7-3.4 3.3-5.6 6.5-5.6s5.8 2.2 6.5 5.6M19 8v6M16 11h6"></path></svg>Add friend</span></a>
</section>
</main>

</body></html>
